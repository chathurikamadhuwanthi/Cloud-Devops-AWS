name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ubuntu@${{ secrets.EC2_HOST }}:~/cloud-devops/

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} '
            cd ~/cloud-devops &&
            [ -f .env ] || printf "POSTGRES_DB=appdb\nPOSTGRES_USER=appuser\nPOSTGRES_PASSWORD=$(openssl rand -hex 16)\n" > .env &&
            docker compose up -d --build &&
            docker image prune -f
          '

      - name: Health check
        run: |
          sleep 10
          curl --fail --retry 5 --retry-delay 5 --retry-connrefused http://${{ secrets.EC2_HOST }}/health
